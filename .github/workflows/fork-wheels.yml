name: Fork wheels (manual)

# One-shot wheel builder for fork revs. GitHub-hosted macOS runners ship
# full Xcode (Metal compiler included), so this is how we get installable
# wheels without Xcode on the dev machine.
#
# Builds the SINGLE-package layout (default `python -m build`, no
# MLX_BUILD_* env): backend bundled, no mlx-metal companion package, exactly
# matching what a local `uv sync` source build produces. One wheel per rev.
#
# Trigger: gh workflow run "Fork wheels (manual)" --repo declanhealy2/mlx \
#            --ref main -f rev=<sha> -f python-version=3.13

on:
  workflow_dispatch:
    inputs:
      rev:
        description: 'Fork rev to build (full SHA)'
        required: true
        default: 'c61f580c8f874eb201cca7cf4c02eb65c669157d'
      python-version:
        description: 'Python version'
        required: true
        default: '3.13'
      macos-target:
        description: 'MACOSX_DEPLOYMENT_TARGET'
        required: true
        default: '15.0'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build dependencies
        shell: bash
        run: |
          brew install openmpi ccache
          xcrun -sdk macosx metal --version
          python -m pip install --upgrade pip build setuptools
          mkdir -p wheelhouse

      - uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: fork-wheels-mlx
          max-size: 1G

      - name: Build mlx package (single, backend bundled)
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ inputs.macos-target }}
          CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        run: |
          python setup.py clean --all
          python -m build -w
          mv dist/mlx-*.whl wheelhouse/

      - name: List wheels
        shell: bash
        run: |
          for WHEEL in wheelhouse/*.whl; do unzip -l "$WHEEL" | head -8; echo; done

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: mlx-fork-macos-py${{ inputs.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error
